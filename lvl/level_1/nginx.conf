worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main
        '$remote_addr [$time_local] "$request" '
        '$status $body_bytes_sent';

    log_format challenge_success
        '[FLAG_SUCCESS] level-1-information-disclosure';

    # Учитываем только успешный GET резервного файла.
    map "$request_method:$uri:$status" $level1_success {
        default 0;
        "GET:/assets/legacy-config.json.bak:200" 1;
    }

    access_log /dev/stdout main;
    access_log /app/logs/flags.log challenge_success
        if=$level1_success;

    sendfile on;

    # Временные файлы доступны непривилегированному пользователю.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server {
        listen 5000;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location /assets/ {
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime off;
        }

        location = /assets/legacy-config.json.bak {
            default_type application/json;
        }
    }
}