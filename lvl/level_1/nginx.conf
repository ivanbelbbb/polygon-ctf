worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    log_format main
        '$remote_addr [$time_local] "$request" '
        '$status $body_bytes_sent';

    log_format challenge_success
        '[FLAG_SUCCESS] level-1-information-disclosure';

    # Триггер успеха при запросе файла задачи
    map "$request_method:$uri" $level1_success {
        default 0;
        "GET:/assets/legacy-config.json.bak" 1;
    }

    access_log /dev/stdout main;
    access_log /app/logs/flags.log challenge_success if=$level1_success;

    sendfile on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server {
        listen 5000;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Внедряем кнопку сдачи во все HTML-страницы
        sub_filter_types text/html;
        sub_filter '</body>' '<script src="/__solve.js"></script></body>';
        sub_filter_once on;

        location = /__flag.json {
            alias /app/logs/flag.json;
            default_type application/json;
            add_header Cache-Control "no-store";
        }

        location /assets/ {
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime off;
        }

        # Отдаем файл как HTML, чтобы сработал sub_filter и появилась кнопка
        location = /assets/legacy-config.json.bak {
            default_type text/html;
            charset utf-8;
        }
    }
}